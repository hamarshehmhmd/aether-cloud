version: "3.9"

# aether-cloud: central token proxy + webhook relay
# Runs at api.tryaether.io
# DB: Supabase (external) — no local postgres needed
# Redis: managed here

services:
  cloud-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      # Inside compose, Redis is reachable as "redis" and requires the password.
      # Overrides any REDIS_URL in .env (which is for running outside compose).
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloud.rule=Host(`api.tryaether.io`)"
      - "traefik.http.routers.cloud.tls=true"
      - "traefik.http.routers.cloud.tls.certresolver=letsencrypt"

  redis:
    image: redis:7-alpine
    # No default password: compose refuses to start without REDIS_PASSWORD.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}  # lets the healthcheck authenticate
    volumes:
      - redis_data:/data
    healthcheck:
      # Without auth, PING gets NOAUTH; require an actual PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
